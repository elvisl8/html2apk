plugins {
    id "com.android.application"
}

android {
    namespace "de.devilapi.html2apk.template"
    compileSdk 35

    defaultConfig {
        applicationId "de.devilapi.html2apk.template"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Serves a bundled local site (assets/site/) to the WebView.
    implementation 'androidx.webkit:webkit:1.12.1'
}
